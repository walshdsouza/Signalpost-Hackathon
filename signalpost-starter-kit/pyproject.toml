[project]
name = "norway-company-agent-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "ddgs>=9.5,<10",
  "extruct>=0.18,<1",
  "httpx>=0.27,<1",
  "instructor>=1.7,<2",
  "lxml>=6,<7",
  "openai>=1.60,<4",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1.0,<2",
  "rapidfuzz>=3.9,<4",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[project.optional-dependencies]
crawler = [
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]
sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
